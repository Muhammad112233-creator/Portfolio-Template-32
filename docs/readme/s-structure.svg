<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70">
  <defs><linearGradient id="rb" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox"><stop offset="0.000" stop-color="#ff3b3b"/><stop offset="0.143" stop-color="#ff9f1c"/><stop offset="0.286" stop-color="#ffd23f"/><stop offset="0.429" stop-color="#3ddc84"/><stop offset="0.571" stop-color="#2ec4ff"/><stop offset="0.714" stop-color="#6c63ff"/><stop offset="0.857" stop-color="#ff4ecd"/><stop offset="1.000" stop-color="#ff3b3b"/>
      <animate attributeName="x1" values="0;-1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="2;1" dur="5s" repeatCount="indefinite"/></linearGradient></defs>
  <style>
    .t{font-family:Georgia,'Times New Roman',serif;font-style:italic}
    .n{font-family:ui-monospace,Menlo,monospace;letter-spacing:3px}
    .rule{transform-origin:0 0;animation:draw 2.4s cubic-bezier(.16,1,.3,1) infinite alternate}
    .dot{animation:pulse 1.6s ease-in-out infinite}
    @keyframes draw{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
    @keyframes pulse{50%{opacity:.25}}
  </style>
  <circle class="dot" cx="9" cy="30" r="5" fill="url(#rb)"/>
  <text x="26" y="35" class="n" font-size="13" fill="#958d7f">06</text>
  <text x="66" y="42" class="t" font-size="38" fill="url(#rb)">Project structure</text>
  <rect class="rule" x="0" y="62" width="900" height="3" rx="1.5" fill="url(#rb)"/>
</svg>